# Investing Agent — configuratie (paper trading)
# Wijzig dit bestand, niet de code, om regels aan te passen.
# De AI kan deze waarden NIET lezen of wijzigen.

mode: paper            # enkel 'paper' wordt ondersteund in deze fase
benchmark: SPY

# Universum: ALLE Amerikaanse aandelen (NYSE, NASDAQ, AMEX), ook kleinere bedrijven.
# Geen ETF's, fondsen, warrants of preferente aandelen. Enkel vlot verhandelbare aandelen:
# te weinig volume = dure in- en uitstap en makkelijk te manipuleren koersen.
scan:
  enabled: true
  min_price: 5                    # geen 'penny stocks'
  min_dollar_volume: 10000000     # mediaan ≥ $10 mln verhandeld per dag (alle beurzen)

# Vaste reservelijst: enkel gebruikt als de marktscan mislukt (geen ETF's).
universe:
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - GOOGL
  - META
  - AVGO
  - BRK.B
  - JPM
  - V
  - MA
  - UNH
  - LLY
  - JNJ
  - PG
  - KO
  - PEP
  - COST
  - WMT
  - HD
  - XOM
  - CVX
  - ADBE
  - PLTR
  - AMD
  - NFLX
  - CRM
  - ORCL
  - TSLA
  - UBER

# Crypto (24/7). Voorlopig UIT: eerst focussen op aandelen.
# Terug aanzetten: symbols: [BTC/USD, ETH/USD]
crypto:
  symbols: []
  max_total_pct: 20           # crypto samen nooit meer dan dit
  max_position_pct: 12        # per munt

# Strategie: regels maken een shortlist + voorstel; de AI kiest (ai_mode: pick)
strategy:
  target_invested_pct: 95     # rest blijft cash
  score: mom6                 # rangschikking: 6-maands momentum (laatste maand uitgezonderd); backtest beste in beide periodes
  stock_top_n: 5              # sterkste N aandelen (geconcentreerd = meer rendement, ook meer schommeling)
  hold_buffer: 5              # bestaande positie houden zolang ze in top (N + buffer) staat (minder omzet)
  rebalance_band_pct: 3       # bestaande posities pas bijsturen bij > 3% afwijking (backtest: veel minder kosten)
  max_vol_pct: 150            # extreem beweeglijke aandelen (vaak hype/pump) overslaan
  exclude_benchmark: true     # SPY is enkel vergelijking, nooit een positie
  sector_max_pct: null        # UIT: eerlijke backtest (S&P 500) toonde lager rendement met 25%; bv. 25 of 40 om aan te zetten
  market_filter: false        # SPY onder 200d -> minder belegd (eerst backtesten)
  bear_invested_pct: 30       # belegd deel als de marktfilter aanslaat
  trend_sma_days: 200         # enkel bezitten boven dit gemiddelde
  crypto_momentum_days: 90    # crypto: positief rendement over 90 dagen vereist
  ai_filter: true             # AI aan (uit = enkel regels)
  ai_mode: pick               # pick: AI kiest zelf uit de shortlist | filter: AI mag enkel verkleinen
  shortlist_n: 25             # zoveel sterkste kandidaten (trend + momentum) krijgt de AI te zien
  ai_min_positions: 3
  ai_max_positions: 10        # harde limieten blijven: max 20% per aandeel, 95% belegd, noodrem -15%

# Schaduwportefeuilles (virtueel doorgerekend, worden NIET verhandeld)
shadows:
  enabled: true
  cost_pct: {stock: 0.05, crypto: 0.25}   # geschatte kosten per transactie (spread + fee)
  ai_free_max_position_pct: 25

risk:
  max_drawdown_pct: 15        # vanaf piek: geen nieuwe aankopen meer (pauzestand)
  pause_days: 28              # na zoveel dagen pauze wordt de piek gereset (anders eeuwig geblokkeerd)
  max_position_pct: 20        # max gewicht per aandeel (5 posities)
  min_cash_pct: 5             # minimale cashbuffer
  max_orders_per_day: 16
  min_order_usd: 100          # kleinere aanpassingen worden genegeerd
  min_ai_confidence: 0.6      # enkel voor AI-gestuurde beslissingen
  max_data_age_hours: 96      # aandelen: oudere koersdata -> geen nieuwe orders
  max_crypto_data_age_hours: 36

schedule:
  check_interval_min: 15      # tijdens beursuren: posities/orders controleren
  premarket_hours: 3          # onderzoek en plan maken tot X uur vóór de opening
  execute_after_open_min: 5   # plan uitvoeren vanaf X min na de opening (eerste minuten zijn erg onrustig)
  news_interval_min: 60       # buiten beursuren: nieuws ophalen en bewaren

ai:
  model: gemini-3.8-flash     # controleer actuele modelnaam/quota in Google AI Studio
  fallback_models: [gemini-3.5-flash, gemini-3.7-flash, gemini-flash-latest]
  temperature: 0.2
  max_calls_per_day: 12        # kostenrem: max geslaagde (betaalde) AI-aanroepen per dag
  max_attempts_per_day: 40     # vangnet: max pogingen per dag (mislukte pogingen worden niet aangerekend)
  max_cost_per_month_usd: 5    # harde maandlimiet (geschat); daarna geen AI-analyses meer
  price_per_mtok: {input: 0.75, output: 3.75}   # gemini-3.8-flash t/m 2026; vanaf 2027: 1.50 / 7.50
  news_per_symbol: 3
  news_lookback_hours: 72
