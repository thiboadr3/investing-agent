name: Investing Agent

on:
  schedule:
    # Elke 30 min op weekdagen, 10:00–21:30 UTC: onderzoek vóór de opening (plan),
    # uitvoering vlak na de opening, opvolging tijdens de sessie (zomer- en wintertijd).
    # De agent controleert zelf of de beurs open is (feestdagen, vroege sluiting).
    - cron: "*/30 10-21 * * 1-5"
  workflow_dispatch:
    inputs:
      command:
        description: "status | tick | once | report | notify-test"
        default: "tick"

permissions:
  contents: write   # nodig om het logboek naar de 'state'-branch te schrijven

concurrency:
  group: investing-agent
  cancel-in-progress: false   # nooit twee runs tegelijk

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Noodstop: zet repository-variabele AGENT_STOP op 'true'
    if: ${{ vars.AGENT_STOP != 'true' }}
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Standaard 'paper': orders op de Alpaca-PAPERrekening (nep-geld). Zet variabele TRADING_MODE
      # op 'dry_run' om enkel te loggen zonder iets te plaatsen. Live trading bestaat niet in deze code.
      TRADING_MODE: ${{ vars.TRADING_MODE }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Logboek ophalen
        run: |
          mkdir -p data reports
          if git fetch --depth=1 origin +refs/heads/state:refs/remotes/origin/state 2>/dev/null; then
            git show origin/state:agent.db > data/agent.db || true
            git show origin/state:WEEKLY.md > reports/WEEKLY.md 2>/dev/null || rm -f reports/WEEKLY.md
          fi

      - name: Tests risicoregels
        run: python -m pytest -q

      - name: Agent
        run: |
          CMD="${{ github.event.inputs.command || 'tick' }}"
          case "$CMD" in status|tick|once|report|notify-test) ;; *) echo "Onbekend commando: $CMD"; exit 1;; esac
          if [ "$TRADING_MODE" = "dry_run" ]; then FLAG="--dry-run"; echo "Modus: DRY-RUN (niets wordt geplaatst)"
          else FLAG=""; echo "Modus: PAPER (orders op paperrekening)"; fi
          if [ "$CMD" = "status" ] || [ "$CMD" = "report" ]; then python -m agent "$CMD"
          else python -m agent "$CMD" $FLAG; fi

      - name: Melding bij mislukte run
        if: failure() && env.TELEGRAM_BOT_TOKEN != ''
        run: |
          CHAT="$TELEGRAM_CHAT_ID"
          if [ -z "$CHAT" ] && [ -f data/agent.db ]; then
            CHAT=$(python -c "import sqlite3,json;r=sqlite3.connect('data/agent.db').execute(\"select value from state where key='telegram_chat_id'\").fetchone();print(json.loads(r[0]) if r else '')")
          fi
          [ -n "$CHAT" ] || exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$CHAT" \
            --data-urlencode text="⚠️ Investing Agent: run mislukt. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null

      - name: Logboek bewaren
        if: always()
        run: |
          [ -f data/agent.db ] || exit 0
          cp data/agent.db /tmp/agent.db
          [ -f reports/PORTFOLIO.md ] && cp reports/PORTFOLIO.md /tmp/PORTFOLIO.md || true
          [ -f reports/WEEKLY.md ] && cp reports/WEEKLY.md /tmp/WEEKLY.md || true
          git config user.name "investing-agent"
          git config user.email "actions@users.noreply.github.com"
          if git fetch --depth=1 origin +refs/heads/state:refs/remotes/origin/state 2>/dev/null; then
            git checkout -B state origin/state
          else
            git checkout --orphan state && git rm -rf --quiet .
          fi
          cp /tmp/agent.db agent.db
          [ -f /tmp/PORTFOLIO.md ] && cp /tmp/PORTFOLIO.md PORTFOLIO.md && cp /tmp/PORTFOLIO.md README.md || true
          [ -f /tmp/WEEKLY.md ] && cp /tmp/WEEKLY.md WEEKLY.md || true
          git add agent.db $(ls PORTFOLIO.md README.md WEEKLY.md 2>/dev/null)
          git commit -qm "logboek $(date -u +%FT%TZ)" || exit 0
          git push -q origin state
